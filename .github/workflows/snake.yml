# Redraws the contribution snake every night and pushes it to the "output" branch,
# which is where the README reads snake-dark.svg and snake-light.svg from.
name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#4d7c0f&color_dots=#ebedf0,#d9f99d,#a3e635,#65a30d,#3f6212
            dist/snake-dark.svg?palette=github-dark&color_snake=#f5e416&color_dots=#161b22,#1f3a0f,#3f6212,#65a30d,#a3e635

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
